# PROVISIONAL: el backend tiene el wrangler.toml real.
name = "pneuma-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[vars]
SITIO_URL = "http://localhost:5173"
MODO_DEMO = "1"

[[d1_databases]]
binding = "DB"
database_name = "pneuma"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARCHIVOS"
bucket_name = "pneuma-archivos"
